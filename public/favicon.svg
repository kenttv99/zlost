<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="emberGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFC58D" />
      <stop offset="35%" stop-color="#FF7B47" />
      <stop offset="75%" stop-color="#E05D38" />
      <stop offset="100%" stop-color="#9C2D11" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E05D38" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#151412" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Inner Subtle Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="rgba(224, 93, 56, 0.18)" stroke-width="1" />

  <!-- Flame Core & Stylized Letter 'Я' -->
  <g filter="url(#glow)">
    <!-- Flame Tongue Center Top -->
    <path d="M32 10 C34 15, 38 18, 36 24 C34 20, 31 17, 32 10 Z" fill="#FFE3C2" />
    <path d="M33 13 C38 18, 41 23, 37 28 C34 24, 30 20, 33 13 Z" fill="url(#emberGrad)" />
    
    <!-- Stylized 'Я' Monogram with Flame Contours -->
    <!-- Right vertical stem -->
    <path d="M36 26 L36 51 C36 52 38 52 40 52 L40 54 L32 54 L32 52 C34 52 36 52 36 51 Z" fill="url(#emberGrad)" />
    
    <!-- Left loop with flame curve -->
    <path d="M36 26 C31 24, 21 26, 21 34 C21 41, 30 42, 36 41 C36 38, 26 38, 26 34 C26 29, 33 28, 36 29 Z" fill="url(#emberGrad)" />
    
    <!-- Left leg curving outward -->
    <path d="M32 39 C28 44, 23 49, 18 52 C17 52.8, 16 53.5, 15 54 L21 54 C25 50, 30 45, 33 40 Z" fill="url(#emberGrad)" />

    <!-- Inner Core Fire Spark -->
    <circle cx="32" cy="27" r="2.2" fill="#FFF4E6" />
  </g>
</svg>